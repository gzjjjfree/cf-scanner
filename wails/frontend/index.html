<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <style>
      #log-container {
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 15px;
        height: 300px;
        overflow-y: auto;
        font-family: "Consolas", monospace;
        border-radius: 8px;
        text-align: left;
        margin: 20px;
        font-size: 13px;
        line-height: 1.5;
      }
      .log-entry {
        border-bottom: 1px solid #333;
        margin-bottom: 4px;
      }
      button {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .btn-stop {
        background-color: #ff4d4f;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .btn-stop:hover {
        background-color: #ff7875;
      }
      .btn-stop:disabled {
        background-color: #f5f5f5;
        color: #00000040;
        cursor: not-allowed;
      }
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        margin-top: 20px;
      }
      #log-container {
        /* 核心属性：保留换行符和空格，且允许自动换行 */
        white-space: pre-wrap;

        /* 可选：如果你希望像代码编辑器那样，不自动换行而显示横向滚动条 */
        /* white-space: pre; */

        /* 建议：确保使用等宽字体，更符合日志风格 */
        font-family: monospace;

        /* 允许长单词或 URL 换行 */
        word-wrap: break-word;
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 10px;
        height: 500px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <h2>CF-Scanner 实时控制台</h2>

    <div id="controls">
      <label
        >线程数:
        <input type="number" id="nthreads" value="100" style="width: 40px"
      /></label>
      <label style="margin-left: 10px"
        >每段 IP 抽样数:
        <input type="number" id="test_num" value="500" style="width: 40px"
      /></label>
      <label style="margin-left: 10px"
        >最大允许延时:
        <input type="number" id="latency" value="200" style="width: 40px"
      /></label>
      <label style="margin-left: 10px"
        >最低下载速度 (MB/s):
        <input type="number" id="speed" value="5" style="width: 40px"
      /></label>
      <label style="margin-left: 10px"
        >最终结果数:
        <input type="number" id="count" value="100" style="width: 40px"
      /></label>
    </div>

    <div class="status-bar">
      <div id="statusText">状态: 待机</div>
      <button id="startBtn" onclick="doScan()">开始扫描</button>
      <button id="stopBtn" onclick="stopScan()" class="btn-stop" disabled>
        停止扫描
      </button>
      <button id="clearBtn">清空日志</button>
    </div>

    <div id="log-container"></div>

    <script type="module">
      // 导入 Wails 运行时库
      import * as runtime from "./src/wailsjs/runtime/runtime.js";
      import { StartScan } from "./src/wailsjs/go/main/SimpleApp.js";

      /**
       * LogHandler - 处理实时日志与进度条渲染
       */
      class LogHandler {
        constructor(containerId, maxLines = 1000) {
          this.container = document.getElementById(containerId);
          this.maxLines = maxLines;
          this.logBuffer = []; // 存储每一行日志
        }

        // 处理 WebSocket 传来的 JSON 对象
        handleWSMessage(msg) {
          try {
            if (msg.type === "log") {
              let addn = "";
              if (/^\s*\n/.test(msg.data)) {
                addn = "\n";
                msg.data = msg.data.replace(/\n/, "");
              }

              const cleanLine = msg.data.replace(/\n$/, "");
              if (cleanLine.includes("\n")) {
                this.processLog(cleanLine);
              }
              this.processLog(
                `${addn}[${new Date().toLocaleTimeString()}] ${cleanLine}`
              );
            } else if (msg.type === "status") {
              this.updateUIStatus(msg.data.is_scanning);
            }
          } catch {
            // 如果不是 JSON，兼容处理成纯文本日志
            this.processLog(msg);
          }
        }

        /**
         * 处理收到的原始消息
         * @param {string} msg - 后端传来的原始字符串 (包含 \r 或 \n)
         */
        processLog(msg) {
          if (!msg) return;
          const lastIdx = this.logBuffer.length - 1;
          if (
            msg.includes("\r") &&
            lastIdx >= 0 &&
            this.logBuffer[lastIdx].includes("\r")
          ) {
            this.updateLastLine(msg);
          } else {
            if (
              lastIdx >= 0 &&
              this.shouldMerge(this.logBuffer[lastIdx], msg)
            ) {
              this.logBuffer[lastIdx] += msg;
            } else if (
              lastIdx >= 0 &&
              this.logBuffer[lastIdx].trim().length < 12
            ) {
              this.updateLastLine(msg);
            } else {
              this.appendLine(msg);
            }
          }

          this.render();
        }

        // 提取合并判定逻辑，避免污染主流程
        shouldMerge(lastLine, newLine) {
          // 只有当最后一行包含“秒”且不包含“MB”时才合并，且确保它不是进度条
          return (
            (lastLine.includes("秒") && !lastLine.includes("MB")) ||
            lastLine.includes("context")
          );
        }

        // 替换最后一行内容（用于展示进度条）
        updateLastLine(content) {
          if (this.logBuffer.length === 0) {
            this.logBuffer.push(content);
          } else {
            if (this.logBuffer[this.logBuffer.length - 1].includes("速")) {
              this.logBuffer.push(content);
              return;
            }
            this.logBuffer[this.logBuffer.length - 1] = content;
          }
        }

        // 追加新行
        appendLine(content) {
          this.logBuffer.push(content);
          // 限制缓冲区大小，防止内存溢出
          if (this.logBuffer.length > this.maxLines) {
            this.logBuffer.shift();
          }
        }

        // 更新界面按钮状态
        updateUIStatus(isScanning) {
          const startBtn = document.getElementById("startBtn");
          const stopBtn = document.getElementById("stopBtn");

          if (isScanning) {
            startBtn.disabled = true;
            stopBtn.disabled = false;
          } else {
            startBtn.disabled = false;
            stopBtn.disabled = true;
            this.processLog("\n✨ 扫描任务已结束。\n");
          }
        }

        // 渲染到 DOM
        render() {
          // 使用 textContent 防止 XSS 攻击，并保持原始格式
          this.container.textContent = this.logBuffer.join("\n");
          // 自动滚动到底部
          this.container.scrollTop = this.container.scrollHeight;
        }

        // 清空日志
        clear() {
          this.logBuffer = [];
          this.container.textContent = "";
        }
      }

      const Logmsg = new LogHandler("log-container");
      const getContainer = () => document.getElementById("log-container");
      let isScanning = false;

      Logmsg.processLog(
        `[${new Date().toLocaleTimeString()}] "🟢 已连接到后端实时日志系统...\n"`
      );
      // 监听扫描日志
      runtime.EventsOn("scan_log", (msg) => {
        Logmsg.handleWSMessage(msg);
      });

      window.doScan = () => {
        const startBtn = document.getElementById("startBtn");
        startBtn.disabled = true; // 立即变灰，防止连点
        const command = {
          Type: "start",
          Data: {
            min_speed: document.getElementById("speed").value || 5,
            test_num: document.getElementById("test_num").value || 10,
            min_latency: document.getElementById("latency").value || 200,
            final_count: document.getElementById("count").value || 500,
            nthreads: document.getElementById("nthreads").value || 10,
          },
        };

        Logmsg.clear();
        // 调用 Go 方法
        try {
          StartScan(command);
        } catch (err) {
          startBtn.disabled = false; // 出错则恢复
          console.error(err);
        }
      };

      window.stopScan = () => {
        const command = {
          Type: "stop",
        };
        StartScan(command);
      };
      document.getElementById("clearBtn").addEventListener("click", () => {
        Logmsg.clear();
      });
    </script>
  </body>
</html>
