name: Wails Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号 (例如 1.0.1)"
        required: false
        default: "manual-build"

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows/amd64
            os: windows-latest
          - platform: darwin/universal
            os: macos-latest
          - platform: linux/amd64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.4"

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # --- 仅在 Linux 环境安装构建依赖 ---
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Frontend Manually
        # 显式进入前端目录，安装并构建，这样我们可以完全控制权限
        run: |
          cd app/frontend
          npm install
          # 关键：赋予 vite 执行权限
          chmod +x node_modules/.bin/vite
          npm run build

      - name: Build Wails App
        # 使用 -skipfrontend 参数
        # 既然我们上面已经 build 好了，Wails 只需要负责 Go 编译和资源嵌入
        run: |
          wails build -platform ${{ matrix.platform }} -ldflags "-X 'main.isWails=true' -s -w" -skipfrontend

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-scanner-${{ matrix.platform }}
          path: build/bin/*

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
