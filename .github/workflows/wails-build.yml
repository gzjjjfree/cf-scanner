name: Wails Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号 (例如 1.0.1)"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows/amd64
            os: windows-latest
          - platform: darwin/universal
            os: macos-latest
          - platform: linux/amd64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.4"

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # --- 仅在 Linux 环境安装构建依赖 ---
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # 安装 GTK 和 WebKit2Gtk 4.1
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

          # 【核心步骤】创建软连接，欺骗 Wails，让它以为 4.1 就是 4.0
          # 这是解决新版 Ubuntu 编译老版 Wails 项目的标准 Trick
          sudo ln -s /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Frontend Manually
        # 核心修复：强制使用 bash 运行，这样你的 if 语句在 Windows 上也能跑通
        shell: bash
        run: |
          cd app/frontend
          npm install
          # 现在的语法在 Windows/Linux/macOS 下都能被 Bash 正确解析了
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod -R +x node_modules/.bin/
          fi
          npm run build

      - name: Build Wails App
        # 使用 -s 标志明确跳过前端构建
        run: |
          wails build -platform ${{ matrix.platform }} -ldflags "-X 'main.isWails=true' -s -w" -s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          # 核心修复：手动将斜杠替换为横杠，或者直接写死
          # 方式 1：手动根据平台命名（最稳妥）
          name: cf-scanner-wails-${{ matrix.os }}-${{ strategy.job-index }}
          # 方式 2：如果你想保留架构信息，手动写：
          # name: cf-scanner-windows-amd64

          path: build/bin/*

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
