name: Wails Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号 (例如 1.0.1)"
        required: false
        default: "manual-build"

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: windows/amd64
            os: windows-latest
          - platform: darwin/universal
            os: macos-latest
          - platform: linux/amd64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.24.4"

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # --- 仅在 Linux 环境安装构建依赖 ---
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Wails App
        # 核心：将 isWails 设为字符串 "true"
        run: |
          wails build -platform ${{ matrix.platform }} -ldflags "-X 'main.isWails=true' -s -w"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-scanner-${{ matrix.platform }}
          path: build/bin/*

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
