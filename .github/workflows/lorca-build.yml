name: Build Lorca App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: cf-scanner-lorca-windows.exe
          - os: macos-latest
            platform: macos
            artifact_name: cf-scanner-lorca-macos
          - os: ubuntu-latest
            platform: linux
            artifact_name: cf-scanner-lorca-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          check-latest: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 1. 构建前端
      - name: Build Frontend
        shell: bash
        run: |
          cd frontend  # 如果你的前端目录叫 app/frontend 请修改此处
          npm install
          npm run build

      # 2. 安装 Go 依赖
      - name: Install Go Dependencies
        run: |
          go mod tidy

      # 3. 编译二进制文件
      # Windows 下增加 -H=windowsgui 隐藏控制台黑窗口
      - name: Build Binary
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
            go build -ldflags "-s -w -H=windowsgui" -o ${{ matrix.artifact_name }} .
          else
            go build -ldflags "-s -w" -o ${{ matrix.artifact_name }} .
          fi

      # 4. 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      # 5. 如果有 Tag 推送，自动创建 Release
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.artifact_name }}