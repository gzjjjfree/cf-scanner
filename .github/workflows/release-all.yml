  #        - { os: macos-latest, platform: macos, name: cf-scanner-fyne-mac }
  #        - { os: ubuntu-latest, platform: linux, name: cf-scanner-fyne-linux }
  #  steps:
  #    - uses: actions/checkout@v4
  #    - uses: actions/setup-go@v5
  #      with: { go-version: "1.24.4" }
#
  #    # 为 Linux 安装图形开发库依赖
  #    - name: Install Linux Deps
  #      if: matrix.platform == 'linux'
  #      run: |
  #        sudo apt-get update
  #        sudo apt-get install -y libgl1-mesa-dev xorg-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev
#
  #    - name: Build
  #      shell: bash
  #      run: |
  #        # 进入你的 fyne 代码目录，如果是根目录则忽略 cd
  #        cd fyne
  #        LDFLAGS="-s -w"
  #        if [ "${{ matrix.platform }}" == "windows" ]; then 
  #          LDFLAGS="$LDFLAGS -H=windowsgui"
  #        fi
  #        
  #        # 确保资源已经 bundle (建议在本地 bundle 好并提交，或者在此执行 fyne bundle)
  #        go build -ldflags "$LDFLAGS" -o "${{ matrix.name }}" .
#
  #    - name: Upload Artifact
  #      uses: actions/upload-artifact@v4
  #      with:
  #        name: fyne-${{ matrix.platform }}
  #        path: ./fyne/${{ matrix.name }}

  # --- 任务 5: 汇总并正式发布 ---
  publish:
    name: Finalize Release
    needs: [build-cli, build-lorca, build-wails, build-fyne]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-files
          merge-multiple: true # 将所有子任务的文件合并到一个目录

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./all-files/*
          generate_release_notes: true
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
