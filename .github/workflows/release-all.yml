name: CF-Scanner Multi-Version Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- 任务 1: 构建 命令行 (CLI) 版本 ---
  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: android, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.4", cache: true }
      - name: Build
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          OUTPUT_NAME="cf-scanner-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags "-s -w -X 'github.com/gzjjjfree/cf-scanner/cmd.Version=${TAG_NAME}'" \
          -o release/$OUTPUT_NAME .
      - uses: actions/upload-artifact@v4
        with:
          name: cf-scanner-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*

  # --- 任务 2: 构建 Lorca (GUI) 版本 ---
  build-lorca:
    name: Build Lorca
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - {os: windows-latest, platform: windows, name: cf-scanner-lorca-win.exe}
          - {os: macos-latest, platform: macos, name: cf-scanner-lorca-mac}
          - {os: ubuntu-latest, platform: linux, name: cf-scanner-lorca-linux}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.4" }
      - name: Build
        shell: bash
        run: |
          cd lorca
          LDFLAGS="-s -w"
          if [ "${{ matrix.platform }}" == "windows" ]; then LDFLAGS="$LDFLAGS -H=windowsgui"; fi
          go build -ldflags "$LDFLAGS" -o "${{ matrix.name }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: lorca-${{ matrix.platform }}
          path: lorca/${{ matrix.name }}

  # --- 任务 3: 构建 Wails (GUI) 版本 ---
  build-wails:
    name: Build Wails
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: windows-latest, platform: windows/amd64, tag: win }
          - { os: ubuntu-latest, platform: linux/amd64, tag: linux }
          - { os: macos-latest, platform: darwin/universal, tag: mac }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.4" }
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - name: Linux Deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config
          sudo ln -s /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/webkit2gtk-4.0.pc
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        shell: bash
        run: |
          cd wails/frontend
          npm install
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            chmod -R +x node_modules/.bin/
          fi
          npm run build
          cd ..
          # 关键点：根据平台判断是否加 .exe
          EXT=""
          if [ "${{ matrix.os }}" == "windows-latest" ]; then EXT=".exe"; fi
          wails build -platform ${{ matrix.platform }} -ldflags "-s -w" -o "cf-scanner-wailsUI-${{ matrix.tag }}$EXT"
          # --- 针对 macOS 的特殊处理 ---
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            # Wails 在 mac 上通常会生成 build/bin/cf-scanner-wailsUI-mac.app
            # 我们进入该目录并压缩它
            cd build/bin
            zip -r ../../../cf-scanner-wailsUI-mac.zip ./*.app
            cd ../..
          else
            # Windows 和 Linux，直接把 build/bin 下的文件挪到根目录方便上传
            cp build/bin/* ../
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wails-${{ matrix.tag }}
          path: |
            cf-scanner-wailsUI-mac.zip
            cf-scanner-wailsUI-win.exe
            cf-scanner-wailsUI-linux

  # --- 任务 4: 构建 Fyne (GUI) 版本 ---
  #build-fyne:
  #  name: Build Fyne
  #  runs-on: ${{ matrix.os }}
  #  strategy:
  #    matrix:
  #      include:
