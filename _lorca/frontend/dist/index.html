<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <style>
      #log-container {
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 15px;
        height: 300px;
        overflow-y: auto;
        font-family: "Consolas", monospace;
        border-radius: 8px;
        text-align: left;
        margin: 20px;
        font-size: 13px;
        line-height: 1.5;
      }
      .log-entry {
        border-bottom: 1px solid #333;
        margin-bottom: 4px;
      }
      button {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .btn-stop {
        background-color: #ff4d4f;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s;
      }
      .btn-stop:hover {
        background-color: #ff7875;
      }
      .btn-stop:disabled {
        background-color: #f5f5f5;
        color: #00000040;
        cursor: not-allowed;
      }
      .btn-start:disabled {
        background-color: #f5f5f5;
        color: #00000040;
        cursor: not-allowed;
      }
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        margin-top: 20px;
      }
      #log-container {
        /* 核心属性：保留换行符和空格，且允许自动换行 */
        white-space: pre-wrap;

        /* 可选：如果你希望像代码编辑器那样，不自动换行而显示横向滚动条 */
        /* white-space: pre; */

        /* 建议：确保使用等宽字体，更符合日志风格 */
        font-family: monospace;

        /* 允许长单词或 URL 换行 */
        word-wrap: break-word;
        background: #1e1e1e;
        color: #d4d4d4;
        padding: 10px;
        height: 500px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <h2>CF-Scanner 实时控制台</h2>

    <div id="controls">
      <label
        >线程数:
        <input type="number" id="nthreads" value="100" style="width: 40px"
      /></label>
      <label style="margin-left: 10px"
        >每段 IP 抽样数:
        <input type="number" id="test_num" value="500" style="width: 40px"
      /></label>
      <label style="margin-left: 10px"
        >最大允许延时:
        <input type="number" id="latency" value="200" style="width: 40px"
      /></label>
      <label style="margin-left: 10px"
        >最低下载速度 (MB/s):
        <input type="number" id="speed" value="5" style="width: 40px"
      /></label>
      <label style="margin-left: 10px"
        >最终结果数:
        <input type="number" id="count" value="10" style="width: 40px"
      /></label>
    </div>

    <div class="status-bar">
      <div id="statusText">状态: 待机</div>
      <button id="downloadBtn">下载说明</button>
      <button id="startBtn" class="btn-start">开始扫描</button>
      <button id="stopBtn" class="btn-stop" disabled>停止扫描</button>
      <button id="clearBtn">清空日志</button>
    </div>

    <div id="log-container"></div>

    <script type="module">
      /**
       * LogHandler - 处理实时日志与进度条渲染
       */
      class LogHandler {
        constructor(containerId, maxLines = 1000) {
          this.container = document.getElementById(containerId);
          this.maxLines = maxLines;
          this.logBuffer = []; // 存储每一行日志
        }

        // 处理传来的对象
        handleWSMessage(msg) {
          let str = msg.data;
          try {
            let before, behide, beforer, behider;
            if (msg.type === "log") {
              ({ leading: before, trailing: behide } = this.countEdgeSubstrings(
                str,
                "\n"
              ));
              ({ leading: beforer, trailing: behider } =
                this.countEdgeSubstrings(str, "\r"));

              for (let i = 0; i < before; i++) {
                this.appendLine("\n");
              }

              str = str.replaceAll("\n", "");
              str = str.replaceAll("\r", "");

              const lastIdx =
                this.logBuffer.length > 0 ? this.logBuffer.length - 1 : -1;

              if (lastIdx >= 0) {
                // 已有行数才进行更新行操作
                if (beforer > 0) {
                  if (behider == 0) {
                    // 只更新有内容的进度条 开头单 \r
                    if (this.logBuffer[lastIdx].length == 1) {
                      this.appendLine("\n");
                    }
                    str = `[${new Date().toLocaleTimeString()}] ` + str;

                    this.logBuffer[this.logBuffer.length - 1] = str;
                  }
                } else {
                  // 追加到最后一行, 如果最后一行是刚才添加的换行符，没有日期时添加日期
                  if (this.logBuffer[lastIdx].length < 20) {
                    str = `[${new Date().toLocaleTimeString()}] ` + str;
                  }
                  this.logBuffer[lastIdx] += str;
                }
                // // 行后的换行符，每个 \n 增加一行 logDataList
                for (let i = 0; i < behide; i++) {
                  this.appendLine("\n");
                }
                this.render();
                return;
              } else {
                // 没有行数时，直接增加一行
                str = `[${new Date().toLocaleTimeString()}] ` + str;
                this.appendLine(str);
              }

              for (let i = 0; i < behide; i++) {
                this.appendLine("\n");
              }
              this.render();
            } else if (msg.type === "status") {
              this.updateUIStatus(msg.data.is_scanning);
            }
          } catch {
            // 如果不是 JSON，兼容处理成纯文本日志
            str = `[${new Date().toLocaleTimeString()}] ` + str;
            this.appendLine(str);
          }
        }

        // 返回字符串开头及结尾子串的个数
        countEdgeSubstrings(str, char) {
          // 转换特殊字符以便用于正则 (例如 \n 转为 \\n)
          const escapedChar = char.replace(/[.*+?^${}()|[\]\ll]/g, "\\$&");

          // ^: 匹配开头; +: 匹配一个或多个; $: 匹配结尾
          const leadingRegex = new RegExp(`^${escapedChar}+`);
          const trailingRegex = new RegExp(`${escapedChar}+$`);

          const leadingMatch = str.match(leadingRegex);
          const trailingMatch = str.match(trailingRegex);

          return {
            leading: leadingMatch ? leadingMatch[0].length : 0,
            trailing: trailingMatch ? trailingMatch[0].length : 0,
          };
        }

        // 追加新行
        appendLine(content) {
          this.logBuffer.push(content);
          // 限制缓冲区大小，防止内存溢出
          if (this.logBuffer.length > this.maxLines) {
            this.logBuffer.shift();
          }
        }

        // 更新界面按钮状态
        updateUIStatus(isScanning) {
          const startBtn = document.getElementById("startBtn");
          const stopBtn = document.getElementById("stopBtn");

          if (isScanning) {
            startBtn.disabled = true;
            stopBtn.disabled = false;
          } else {
            startBtn.disabled = false;
            stopBtn.disabled = true;
            this.handleWSMessage({
              type: "log",
              data: "\n✨ 扫描任务已结束。\n",
            });
          }
        }

        // 渲染到 DOM
        render() {
          // 使用 textContent 防止 XSS 攻击，并保持原始格式
          this.container.textContent = this.logBuffer.join("");
          // 自动滚动到底部
          this.container.scrollTop = this.container.scrollHeight;
        }

        // 清空日志
        clear() {
          this.logBuffer = [];
          this.container.textContent = "";
        }
      }

      const Logmsg = new LogHandler("log-container");
      const getContainer = () => document.getElementById("log-container");
      let isScanning = false;

      Logmsg.handleWSMessage({
        type: "log",
        data: `[${new Date().toLocaleTimeString()}] "🟢 已连接到后端实时日志系统...\n"`,
      });
      Logmsg.handleWSMessage({
        type: "log",
        data: "输出的结果文件可以当输入的 IP 列表文件进行精选\n",
      });
      Logmsg.handleWSMessage({
        type: "log",
        data: "简单点就把 result.json 的内容覆盖进 ip.txt 即可\n",
      });
      Logmsg.handleWSMessage({
        type: "log",
        data: "输出的 json 文件格式是 v2ray 改版 v5-result 读取 IP 池的格式\n",
      });
      Logmsg.handleWSMessage({
        type: "log",
        data: "等待扫描开始...\n",
      });

      // 定义接收进度的回调函数 (挂载到 window)
      window.handleScanUpdate = (msg) => {
        Logmsg.handleWSMessage(msg);
      };

      document.addEventListener("DOMContentLoaded", () => {
        const btn = document.getElementById("startBtn");
        if (btn) {
          btn.addEventListener("click", startScanning);
        }

        const sbtn = document.getElementById("stopBtn");
        if (sbtn) {
          sbtn.addEventListener("click", stopScan);
        }
      });

      async function startScanning() {
        const startBtn = document.getElementById("startBtn");
        startBtn.disabled = true; // 立即变灰，防止连点
        const command = {
          Type: "start",
          Data: {
            min_speed: document.getElementById("speed").value || 5,
            test_num: document.getElementById("test_num").value || 10,
            min_latency: document.getElementById("latency").value || 200,
            final_count: document.getElementById("count").value || 500,
            nthreads: document.getElementById("nthreads").value || 10,
          },
        };

        Logmsg.clear();
        try {
          // 调用 Go 绑定的函数
          const result = await window.apiStartScan(command);
          console.log("后端响应:", result);
        } catch (err) {
          startBtn.disabled = false; // 出错则恢复
          console.error("调用失败:", err);
        }
      }
      // 关键：挂载到 window，确保 HTML 的 onclick 能找到它

      async function stopScan() {
        const command = {
          Type: "stop",
        };
        try {
          // 调用 Go 绑定的函数
          const result = await window.apiStartScan(command);
          console.log("后端响应:", result);
        } catch (err) {
          console.error("调用失败:", err);
        }
      }
      document.getElementById("clearBtn").addEventListener("click", () => {
        Logmsg.clear();
      });
    </script>
  </body>
</html>
